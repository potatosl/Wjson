# SPDX-License-Identifier: MPL-2.0
[package]
name = "wjlink"
authors = ["potatosl"]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
description = "MSVC-free Windows link driver for wjson: import libraries generated from system DLLs, a tiny C runtime object, and rust-lld"
publish = false

# No dependencies, by design. On Windows the binary is #![no_std] and imports
# only kernel32/ntdll/shell32 functions through raw-dylib, so it can be built
# by a bare rustup toolchain (`-C linker=rust-lld`) with no MSVC and no
# import libraries. Everything else is linked through it afterwards.

[[bin]]
name = "wjlink"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
