# SPDX-License-Identifier: MPL-2.0
[package]
name = "wjson_core"
authors = ["panda"]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "JSON parser core for the wjson Wave library (C ABI staticlib)"
license = "MPL-2.0"

[lib]
name = "wjson_core"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
panic = "abort"

